<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 865" role="img" aria-labelledby="titulo descricao"><title id="titulo">Trampu · Modelo relacional SQLite</title><desc id="descricao">Cinco tabelas. Contratante e trabalhador são papéis de usuário. Uma avaliação é vinculada ao autor e à candidatura aprovada.</desc><style>.title,.box-title,.label{font-family:Arial,sans-serif}.title{font-size:26px;fill:#132e37;font-weight:bold}.box-title{font-size:18px;fill:#fff;font-weight:bold}.row{font:14px Consolas,monospace;fill:#243c41}.label{font-size:14px;fill:#25493b;paint-order:stroke;stroke:#f4f7ef;stroke-width:4px;stroke-linejoin:round}.line{stroke:#4b7161;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#f4f7ef"/><text x="28" y="44" class="title">Trampu · Modelo relacional SQLite</text><path class="line" d="M337 152H485"/><text x="347" y="141" class="label">1</text><text x="446" y="141" class="label">0..N</text><text x="357" y="178" class="label">contrata</text><path class="line" d="M850 152H990"/><text x="860" y="141" class="label">0..N</text><text x="966" y="141" class="label">1</text><text x="873" y="178" class="label">classifica</text><path class="line" d="M677 393V538"/><text x="688" y="468" class="label">1</text><text x="688" y="525" class="label">0..N</text><text x="607" y="495" class="label">recebe</text><path class="line" d="M337 235H413V584H485"/><text x="348" y="226" class="label">1</text><text x="446" y="573" class="label">0..N</text><text x="329" y="388" class="label">se candidata</text><path class="line" d="M164 278V538"/><text x="174" y="308" class="label">1</text><text x="174" y="523" class="label">0..N</text><text x="175" y="460" class="label">escreve</text><path class="line" d="M337 643H485"/><text x="347" y="634" class="label">0..2</text><text x="457" y="634" class="label">1</text><text x="349" y="669" class="label">avalia</text><g transform="translate(28 80)"><rect width="309" height="198" rx="12" fill="white" stroke="#a2b7aa"/><path d="M12 0h285q12 0 12 12v31H0V12Q0 0 12 0" fill="#183d3a"/><text x="16" y="28" class="box-title">USUARIO</text><text x="15" y="65" class="row">PK id</text><text x="15" y="88" class="row">nome</text><text x="15" y="111" class="row">email UNIQUE</text><text x="15" y="134" class="row">telefone (opcional)</text><text x="15" y="157" class="row">cidade</text><text x="15" y="180" class="row">tipo_usuario</text></g><g transform="translate(485 80)"><rect width="365" height="313" rx="12" fill="white" stroke="#a2b7aa"/><path d="M12 0h341q12 0 12 12v31H0V12Q0 0 12 0" fill="#183d3a"/><text x="16" y="28" class="box-title">OPORTUNIDADE</text><text x="15" y="65" class="row">PK id</text><text x="15" y="88" class="row">FK contratante_id → usuario</text><text x="15" y="111" class="row">FK categoria_id → categoria</text><text x="15" y="134" class="row">titulo, descricao</text><text x="15" y="157" class="row">cidade, local_servico</text><text x="15" y="180" class="row">data_servico</text><text x="15" y="203" class="row">inicio, fim</text><text x="15" y="226" class="row">remuneracao_centavos</text><text x="15" y="249" class="row">quantidade_vagas</text><text x="15" y="272" class="row">requisitos (opcional)</text><text x="15" y="295" class="row">concluida</text></g><g transform="translate(990 80)"><rect width="292" height="106" rx="12" fill="white" stroke="#a2b7aa"/><path d="M12 0h268q12 0 12 12v31H0V12Q0 0 12 0" fill="#183d3a"/><text x="16" y="28" class="box-title">CATEGORIA</text><text x="15" y="65" class="row">PK id</text><text x="15" y="88" class="row">nome UNIQUE</text></g><g transform="translate(485 538)"><rect width="365" height="198" rx="12" fill="white" stroke="#a2b7aa"/><path d="M12 0h341q12 0 12 12v31H0V12Q0 0 12 0" fill="#183d3a"/><text x="16" y="28" class="box-title">CANDIDATURA</text><text x="15" y="65" class="row">PK id</text><text x="15" y="88" class="row">FK trabalhador_id → usuario</text><text x="15" y="111" class="row">FK oportunidade_id → oportunidade</text><text x="15" y="134" class="row">data_candidatura, status</text><text x="15" y="157" class="row">UNIQUE(trabalhador_id,</text><text x="15" y="180" class="row">       oportunidade_id)</text></g><g transform="translate(28 538)"><rect width="309" height="175" rx="12" fill="white" stroke="#a2b7aa"/><path d="M12 0h285q12 0 12 12v31H0V12Q0 0 12 0" fill="#183d3a"/><text x="16" y="28" class="box-title">AVALIACAO</text><text x="15" y="65" class="row">PK id</text><text x="15" y="88" class="row">FK candidatura_id → candidatura</text><text x="15" y="111" class="row">FK autor_id → usuario</text><text x="15" y="134" class="row">nota, comentario (opcional)</text><text x="15" y="157" class="row">UNIQUE(candidatura_id, autor_id)</text></g><text x="28" y="818" class="label">PK = chave primária   ·   FK = chave estrangeira   ·   0..2 avaliações por participação, uma de cada parte.</text></svg>
